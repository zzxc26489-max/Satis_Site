name: Finish room 5 gallery

on:
  push:
    branches: ["claude/guest-house-website-satis-yo7i1v"]
    paths: ["tools/room5-finalize/ready.txt"]

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "claude/guest-house-website-satis-yo7i1v"
          fetch-depth: 0
      - name: Patch
        run: python3 tools/room5-finalize/patch.py
      - name: Commit
        run: |
          rm -f tools/room5-finalize/ready.txt tools/room5-finalize/patch.py .github/workflows/room5-finalize.yml
          git config user.name "ChatGPT room photo update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Дом №2: обновить галерею комнаты 5"
          git push origin HEAD:claude/guest-house-website-satis-yo7i1v
