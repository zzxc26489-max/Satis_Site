# Фрагмент для nginx. Вставляется внутрь блока server { ... }
# вашего сайта: include /путь/к/nginx-security.conf;

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# Включать после того, как HTTPS точно работает:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Не отдавать служебные файлы
location ~ /\. { deny all; }
location ~* \.(md|py|sh|bak|log|ya?ml)$ { deny all; }

# Не сообщать версию nginx в ответах
server_tokens off;
