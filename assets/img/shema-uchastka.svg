<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 950" width="600" height="950" role="img" aria-labelledby="planTitle planDesc" font-family="Manrope, &quot;Segoe UI&quot;, system-ui, -apple-system, sans-serif">
<title id="planTitle">Схема участка гостевого дома «Сатис»</title>
<desc id="planDesc">Два больших дома на общей огороженной территории между улицей Красной Армии и улицей Гоголя. За домами — площадка для мероприятий с зонтами, рядом кошкин дом. У Дома №1 беседка и костровое место с лежаками, у Дома №2 своя беседка. Детская зона с качелями и песочницей у Дома №1. Парковка вдоль улицы Гоголя. Дом через дорогу стоит на своей отдельной территории за улицей Гоголя.</desc>
